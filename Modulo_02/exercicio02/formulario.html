<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport"
    content="width=device-width, initial-scale=1.0">
<title>Formulário</title>

<style>
    body{
        font-family:Arial, sans-serif;
        background-color: #f2f2f2;
    }

    .formulario {
        width: 400px;
        margin: 50px auto;
        background-color: white;
        padding:25px;
        border-radius: 10px;
    }

    h1 {
        text-align: center;
    }
    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
    }
    
    input,
    select,
    textarea {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
    }

    button {
        width: 100px;
        margin-top: 20px;
        padding: 12px;
        background-color: #333;
        color:white;
        border:none;
        cursor:pointer;
    }
    
    button:hover {
        background-color: #555;
    }
</style>
</head>

<body>

<div class="formulario">

<h1> Cadastro</h1>

<form>

    <label for="nome">Nome:</label>
    <input type="text"
        id="nome"
        placeholder="Digite seu nome">

    <label for="cidade">Cidade:</label>
    <input type="text"
        id="cidade"
        placeholder="Digite seu Cidade">

    <label for="telefone">Telefone:</label>
    <input type="tel"
        id="telefone"
        placeholder="Digite seu Telefone">

    <label for="email">E-mail:</label>
    <input type="email"
            id="email"
            placeholder="Digite seu e-mail">

    <label for="idade">Idade:</label>
    <input type="number"
    id="idade"
    placeholder="Digite sua idade">

<label for="curso">Curso:</label>

<select id="curso">
<option value="">Selecione</option>
<option value="tds">
            Desenvolvimento de Sistemas
</option>
<option value="adm">
            Administração
</option>
<option value="enfermagem">
            Enfermagem
</option>
</select>

<label for="mensagem">Observação:</label>

<textarea id="mensagem"
               rows="4"
               placeholder="Digite uma observação"></textarea>
               
<button type="submit">
            Cadastrar
</button>
</form>
</div>
</body>
</html>
